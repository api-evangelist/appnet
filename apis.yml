name: App.net
description: >-
  App.net (ADN) was a paid, ad-free real-time social networking and microblogging
  platform launched in 2012 by Dalton Caldwell's Mixed Media Labs after a public
  crowdfunding campaign. It was explicitly developer-first: the App.net Stream API
  exposed posts, users, follows, files, channels, private messaging, filters and a
  real-time streaming/subscription surface, all governed by OAuth 2.0 bearer tokens
  and a consistent data/meta response envelope. Third-party clients (Alpha, and many
  community apps) were built entirely on the public API. App.net announced in 2016
  that it would not renew and the service was shut down on 2017-03-14; the live API
  hosts (api.app.net, developers.app.net) no longer resolve and the app.net domain is
  now operated by an unrelated apps directory. The API documentation (appdotnet/api-spec),
  terms of service, and official SDKs remain publicly preserved on the appdotnet GitHub
  organization, which is the basis for this profile.
