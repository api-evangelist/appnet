  key_types: [user token, app token]
  detail: authentication/appnet-authentication.yml
idempotency:
  supported: false
  note: App.net documented no idempotency-key mechanism.
response_envelope:
  shape: '{ data, meta }'
  data: The requested object or list of objects; omitted entirely on error.
  meta_fields:
    code: Copy of the HTTP status code.
    error_message: Human-readable error description (on error).
    error_slug: Uniquely-identifying error slug (on error).
    error_id: Unique error identifier for support (on error).
    marker: Stream marker object (when relevant).
    max_id: Pagination — highest id in the response.
    min_id: Pagination — lowest id in the response.
    more: Pagination — boolean, whether more results exist.
  docs: https://github.com/appdotnet/api-spec/blob/new-docs/content/reference/make-request/responses.md
pagination:
  style: cursor (id-based)
  request_params:
    since_id: Return results newer than this id.
    before_id: Return results older than this id.
    count: Number of results to return.
  response_fields: [meta.max_id, meta.min_id, meta.more]
metadata:
  annotations: >-
    App.net supported "annotations" — typed, developer-defined metadata attached to
